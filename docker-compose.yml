services:

  # 服务名
  magpie:
    # 模拟一个伪终端
    tty: true
    # 打开标准输入, 可以接受外部输入
    stdin_open: true
    # 指定容器名称
    container_name: magpie
    # 指定为镜像名称或镜像ID
    image: iflyelf/magpie:latest
    # 国内推荐改用华为云 SWR:
    # image: swr.cn-east-3.myhuaweicloud.com/iflyelf/magpie:latest
    # 覆盖容器启动后默认执行的命令
    command: [web, --addr, 0.0.0.0:3430, --no-open]
    # 宿主机共享进程命名空间
    # pid: host
    # 使用系统的 IPC 命名空间
    # ipc: host
    # 允许容器中运行一些特权命令
    privileged: true
    # 指定容器退出后的重启策略为始终重启
    restart: always
    # 指定容器的内核能力(capacity)分配
    cap_add:
      - ALL
    # dns配置
    dns:
      - 10.0.9.60
      - 10.0.9.61
    # 数据卷所挂载路径设置
    volumes:
      # 配置文件
      - ./config:/config
      # 同步宿主机时区与时间
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro,cached
      - /etc/localtime:/etc/localtime:ro,cached
      # 共享内核
      - /sys/fs/bpf:/sys/fs/bpf:rw,cached
      - /lib/modules:/lib/modules:ro,cached
      - /etc/sysctl.conf:/etc/sysctl.conf:ro,cached
    # 环境变量
    environment:
      TZ: Asia/Shanghai
      MAGPIE_ADDR: 0.0.0.0:3425
      MAGPIE_WEB_KEY: 455ab8ef6d96f84d51203f070f32a273
    # 配置容器连接的网络
    network_mode: "host"
    # 指定容器的 ulimits 限制值
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
